                  <!-- Like Button -->
                    <button class="btn btn-danger btn-outline-secondary ms-auto" id="likeBtn" style="color: black;" onclick="addLike()">
                        🤍 Like <span id="likeCount">0</span>
                    </button>

                    <script>
                        let count = Number(localStorage.getItem("likeCount")) || 0;
                        let liked = localStorage.getItem("liked") === "true";

                        function updateButton() {
                            document.getElementById("likeCount").innerText = count;

                            document.getElementById("likeBtn").innerHTML =
                                (liked ? "❤️ Liked " : "🤍 Like ") +
                                '<span id="likeCount">' + count + '</span>';
                        }

                        function addLike() {
                            if (liked) {
                                count--;
                                liked = false;
                            } else {
                                count++;
                                liked = true;
                            }

                            localStorage.setItem("likeCount", count);
                            localStorage.setItem("liked", liked);

                            updateButton();
                        }

                        updateButton();
                    </script>
